name: AI Moderator
permissions:
  pull-requests: write
  models: read
  contents: read
jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
    - name: Collaborator gate
      id: allow
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request
          if (!pr) {
            core.setOutput('skip', 'false')
            return
          }

          const author = pr.user?.login
          if (!author) {
            core.setOutput('skip', 'false')
            return
          }

          try {
            await github.rest.repos.checkCollaborator({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: author
            })
            console.log(`${author} is a collaborator. Skipping moderation.`)
            core.setOutput('skip', 'true')
          } catch (e) {
            if (e.status === 404) {
              console.log(`${author} is not a collaborator. Proceeding with moderation.`)
              core.setOutput('skip', 'false')
            } else {
              console.log(`Error checking collaborator status: ${e.message}. Proceeding with moderation.`)
              core.setOutput('skip', 'false')
            }
          }
    - name: Heuristic signals
      id: heur
      if: steps.allow.outputs.skip != 'true'
      shell: bash
      env:
        TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
        BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
      run: |
        python - << 'PY'
        import os, re, json
        title = os.environ.get("TITLE") or ""
        body = os.environ.get("BODY") or ""
        text = (title + "\n" + body).strip()
        urls = re.findall(r'https?://\S+', text)
        signals = {
          "url_count": len(urls),
          "repeated_urls": len(urls) != len(set(urls)),
          "many_urls": len(urls) >= 3,
          "empty_or_tiny": len(text) < 40,
          "very_long": len(text) > 8000,
          "keywordy": bool(re.search(r'\b(crypto|airdrop|giveaway|whatsapp|telegram|invest|forex)\b', text, re.I)),
        }
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
          f.write("signals=" + json.dumps(signals, ensure_ascii=False) + "\n")
        PY
    - name: Pull request change summary
      id: prmeta
      if: steps.allow.outputs.skip != 'true' && github.event_name != 'issues'
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request
          const number = pr.number

          const perPage = 100
          let page = 1
          let files = []
          for (;;) {
            const resp = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
              per_page: perPage,
              page
            })
            files = files.concat(resp.data || [])
            if (!resp.data || resp.data.length < perPage) break
            page += 1
          }

          const totalFiles = files.length
          const additions = files.reduce((a, f) => a + (f.additions || 0), 0)
          const deletions = files.reduce((a, f) => a + (f.deletions || 0), 0)

          const topFiles = files
            .slice()
            .sort((a, b) => ((b.changes || 0) - (a.changes || 0)))
            .slice(0, 8)
            .map(f => ({
              filename: f.filename,
              status: f.status,
              changes: f.changes,
              additions: f.additions,
              deletions: f.deletions
            }))

          const summary = { total_files: totalFiles, additions, deletions, top_files_by_changes: topFiles }
          core.setOutput("summary", JSON.stringify(summary))
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG ai-source-input begins"
        TITLE=$(cat <<'GERALT_DBG_EOF'
        ${{ toJSON(github.event.pull_request.title) }}
        GERALT_DBG_EOF
        )
        BODY=$(cat <<'GERALT_DBG_EOF'
        ${{ toJSON(github.event.pull_request.body) }}
        GERALT_DBG_EOF
        )
        HEUR=$(cat <<'GERALT_DBG_EOF'
        ${{ toJSON(steps.heur.outputs.signals) }}
        GERALT_DBG_EOF
        )
        PRMETA=$(cat <<'GERALT_DBG_EOF'
        ${{ toJSON(steps.prmeta.outputs.summary) }}
        GERALT_DBG_EOF
        )
        printf 'GERALT_DBG TITLE=%s\n' "$TITLE"
        printf 'GERALT_DBG BODY=%s\n' "$BODY"
        printf 'GERALT_DBG HEUR=%s\n' "$HEUR"
        printf 'GERALT_DBG PRMETA=%s\n' "$PRMETA"
        printf 'GERALT_DBG allow.skip=%s\n' '${{ steps.allow.outputs.skip }}'
        echo "GERALT_DBG ai-source-input end"
      continue-on-error: true
    - name: Detect spam or low-quality content
      id: ai
      if: steps.allow.outputs.skip != 'true'
      shell: bash
      env:
        TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
        BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
      run: |
        {
          echo "response<<GERALT_AI_RESPONSE_EOF"
          printf '%s\n' "$TITLE"
          printf '%s\n' "$BODY"
          echo "GERALT_AI_RESPONSE_EOF"
        } >> "$GITHUB_OUTPUT"
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG sink-input ai.response begins"
        RESP=$(cat <<'GERALT_DBG_EOF'
        ${{ toJSON(steps.ai.outputs.response) }}
        GERALT_DBG_EOF
        )
        printf 'GERALT_DBG ai.response=%s\n' "$RESP"
        RESPLEN=${#RESP}
        printf 'GERALT_DBG ai.response.length=%s\n' "$RESPLEN"
        echo "GERALT_DBG sink-input end"
      continue-on-error: true
    - name: Write audit summary
      if: steps.allow.outputs.skip != 'true'
      shell: bash
      run: |
        {
          echo "### AI moderation report"
          echo ""
          echo "Raw model output."
          echo '```json'
          echo '${{ steps.ai.outputs.response }}'
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_dispatch: null
  pull_request_target:
    types:
    - opened
